[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defensive-ot-exposure-audit"
version = "0.1.0"
description = "Authorized-only TCP exposure checker for water/OT defensive audits"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kurtis", email = "kvandre12@gmail.com"}]
keywords = ["water", "ot", "ics", "plc", "cybersecurity", "defensive", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kvandre12-commits/defensive-ot-exposure-audit"
Repository = "https://github.com/kvandre12-commits/defensive-ot-exposure-audit"
Issues = "https://github.com/kvandre12-commits/defensive-ot-exposure-audit/issues"

[project.scripts]
ot-defense-audit = "ot_defense.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
